name: Vérifier connexion SadTalker (sans publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le client cloud
        run: python -m pip install 'gradio_client>=1.10,<3'
      - name: Vérifier l'API du Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python sadtalker_connector.py --check
