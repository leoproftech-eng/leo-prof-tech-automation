name: Tester studio v2 (voix naturelles)
on:
  workflow_dispatch:
    inputs:
      question_id:
        description: Choisir q001 à q006
        required: false
        default: q001
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Générer la version studio
        env:
          QUESTION_ID: ${{ inputs.question_id }}
        run: python studio_v2.py --id "$QUESTION_ID" --output output_studio
      - uses: actions/upload-artifact@v4
        with:
          name: leo-prof-studio-v2-test
          path: output_studio/
          retention-days: 7
