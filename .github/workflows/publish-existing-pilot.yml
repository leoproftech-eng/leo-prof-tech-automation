name: Publier le pilote approuvé - vidéo existante uniquement
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Identifiant YouTube exact du pilote privé déjà approuvé (11 caractères)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish_existing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer client YouTube
        run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Vérifier la chaîne et publier la vidéo existante approuvée
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_EDIT: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EDIT }}
        run: python publish_existing_video.py --video-id "${{ inputs.video_id }}"
