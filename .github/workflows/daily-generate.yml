name: Léo & le Prof - Génération et publication quotidienne (lots vérifiés)
on:
  schedule:
    # Heure de Québec: 22:00 UTC en été, 23:00 UTC en hiver.
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier le lot du jour (false = validation seulement)'
        type: boolean
        default: false
      day:
        description: 'Date du lot à récupérer (YYYY-MM-DD, vide = aujourd’hui)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: leo-prof-generation-quotidienne
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Choisir un lot inédit et filtrer l'heure locale
        id: plan
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/Toronto"))
          start_day = datetime.date(2026, 11, 27)
          day = datetime.date.fromisoformat(os.environ['REQUESTED_DAY']) if os.environ.get('REQUESTED_DAY') else now.date()
          n = (day - start_day).days
          questions = json.load(open("questions.json", encoding="utf8"))
          total_batches = len(questions) // 3
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          publish = not manual or os.environ.get('MANUAL_PUBLISH') == 'true'
          expected_cron = '0 22 * * *' if now.dst() else '0 23 * * *'
          should_run = manual or os.environ.get('SCHEDULE_CRON') == expected_cron
          batch = 0 if manual and not publish else n + 1
          if should_run and not 0 <= batch < total_batches:
              raise RuntimeError('Lot indisponible : vérifier la date et la banque de questions.')
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if should_run else 'false'}\n")
              out.write(f"start={batch*3}\n")
              out.write(f"day={day}\n")
              out.write(f"publish={str(publish).lower()}\n")
          print("date locale:",now.isoformat(),"lot:",batch+1,"exécuter:",should_run)
          PY
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Dépendances
        if: steps.plan.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'google-auth-httplib2>=0.2,<1' 'requests>=2,<3'
      - name: Vérifier les assets et générer le Short
        id: video
        if: steps.plan.outputs.run == 'true'
        run: |
          test -s assets/avatars/leo.png
          test -s assets/avatars/prof.png
          python -m py_compile studio_officiel_statique.py
          python studio_officiel_statique.py --start "${{ steps.plan.outputs.start }}"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output_officiel/Leo_et_le_Prof_Officiel_Voix_Naturelles.mp4
      - name: Conserver le MP4 pour validation (aucune publication)
        if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leo-prof-${{ steps.plan.outputs.day }}-${{ github.run_number }}
          path: |
            output_officiel/Leo_et_le_Prof_Officiel_Voix_Naturelles.mp4
            output_officiel/metadata.json
            output_officiel/youtube_description.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publier sur YouTube si le pilote est déjà en ligne
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.run == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python publish_daily_public.py --start "${{ steps.plan.outputs.start }}" --day "${{ steps.plan.outputs.day }}"
      - name: Publier le même MP4 en Facebook Reel (si Meta autorisé)
        if: ${{ !cancelled() && steps.plan.outputs.publish == 'true' && steps.plan.outputs.run == 'true' && steps.video.outcome == 'success' }}
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_PAGE_ID" ] || [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "Meta non connecté : aucune publication Facebook. Ajouter META_PAGE_ID et META_PAGE_ACCESS_TOKEN aux Secrets GitHub."
            exit 1
          fi
          python facebook_reels_publish.py --start "${{ steps.plan.outputs.start }}" --day "${{ steps.plan.outputs.day }}"
